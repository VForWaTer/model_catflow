tools:
  catflow:
    title: CATFLOW Hydrological Model
    description: A gfortran version of the CATFLOW hydrological model, wrapped in a Python tool interface.
    command: "python run.py"
    parameters:
      simulation_id:
        type: string
        default: "initial_simulation"
    data:
      inp_dir:
        description: A folder containing the input files for the CATFLOW model.